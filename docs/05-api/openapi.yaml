openapi: 3.1.0
info:
  title: Havena API
  version: 1.0.0
  description: >
    REST API for the Havena neighborhood community platform.
    Backend: Laravel 11 + MySQL 8. Auth: Laravel Sanctum bearer tokens.
    Almost all resources are scoped to a community; send X-Community-Id or use the {cid} path param.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: https://staging-api.havena.app/api/v1
    description: Staging
  - url: https://api.havena.app/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Profile
  - name: Communities
  - name: Notices
  - name: Feed
  - name: Wellness
  - name: Property
  - name: Marketplace
  - name: Gamification
  - name: Admin

paths:
  /auth/register/email:
    post:
      tags: [Auth]
      summary: Register with email & password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                display_name: { type: string }
      responses:
        '201': { $ref: '#/components/responses/AuthToken' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email & password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request an SMS OTP for a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '202': { description: OTP dispatched }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an SMS OTP and authenticate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/register/google:
    post:
      tags: [Auth]
      summary: Register/login with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id_token], properties: { id_token: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/AuthToken' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '204': { description: Logged out }

  /me:
    get:
      tags: [Profile]
      summary: Get current user + profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
    put:
      tags: [Profile]
      summary: Update current profile
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
    delete:
      tags: [Profile]
      summary: Delete account (soft)
      responses:
        '204': { description: Deleted }

  /communities/search:
    get:
      tags: [Communities]
      summary: Search communities (guest-allowed, public info only)
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }

  /communities/{id}/join:
    post:
      tags: [Communities]
      summary: Request to join or join via invite code
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invite_code: { type: string }
      responses:
        '201':
          description: Membership created (pending or approved)
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Membership' } }

  /communities/{cid}/notices:
    get:
      tags: [Notices]
      summary: List notices
      parameters:
        - { $ref: '#/components/parameters/Cid' }
        - { name: type, in: query, schema: { type: string, enum: [announcement, event, update, alert, reminder, neighbor_post] } }
        - { name: upcoming, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { $ref: '#/components/responses/NoticeList' }
    post:
      tags: [Notices]
      summary: Create a notice (type-gated by role)
      parameters: [ { $ref: '#/components/parameters/Cid' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Notice' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notices/{id}/rsvp:
    post:
      tags: [Notices]
      summary: RSVP to an event notice
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, enum: [going, maybe, not_going] } } }
      responses:
        '200': { description: RSVP recorded }

  /communities/{cid}/feed:
    get:
      tags: [Feed]
      summary: Community feed (approved posts)
      parameters:
        - { $ref: '#/components/parameters/Cid' }
        - { name: topic, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Post' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /communities/{cid}/posts:
    post:
      tags: [Feed]
      summary: Create a post
      parameters: [ { $ref: '#/components/parameters/Cid' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                media: { type: array, items: { type: string, format: uri } }
                topic: { type: string }
      responses:
        '201':
          description: Created (moderation pending)
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Post' } } }

  /posts/{id}/comments:
    get:
      tags: [Feed]
      summary: List comments
      parameters: [ { $ref: '#/components/parameters/PathId' }, { $ref: '#/components/parameters/Page' } ]
      responses:
        '200': { description: OK }
    post:
      tags: [Feed]
      summary: Add a comment
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                parent_id: { type: integer, nullable: true }
      responses:
        '201': { description: Created }

  /posts/{id}/react:
    post:
      tags: [Feed]
      summary: React / unreact to a post
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Toggled }

  /{type}/{id}/report:
    post:
      tags: [Feed]
      summary: Report content (post, comment, listing, business)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [posts, comments, listings, businesses] } }
        - { $ref: '#/components/parameters/PathId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [spam, harassment, discrimination, political, religious, other] }
      responses:
        '201': { description: Report filed }

  /wellness/categories:
    get:
      tags: [Wellness]
      summary: List W-E-L-L-S pillars
      responses:
        '200': { description: OK }

  /wellness/courses/{id}:
    get:
      tags: [Wellness]
      summary: Course detail with lessons
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Course' } } }

  /wellness/lessons/{id}/progress:
    post:
      tags: [Wellness]
      summary: Save lesson progress / mark complete
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                progress_percent: { type: integer, minimum: 0, maximum: 100 }
                status: { type: string, enum: [in_progress, completed] }
      responses:
        '200': { description: Saved }

  /amenities/{id}/availability:
    get:
      tags: [Property]
      summary: Available reservation slots for a date
      parameters:
        - { $ref: '#/components/parameters/PathId' }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK }

  /amenities/{id}/reservations:
    post:
      tags: [Property]
      summary: Create a reservation
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                party_size: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Reservation' } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /communities/{cid}/deals:
    get:
      tags: [Marketplace]
      summary: List deals/offers
      parameters: [ { $ref: '#/components/parameters/Cid' }, { $ref: '#/components/parameters/Page' } ]
      responses:
        '200': { description: OK }

  /deals/{id}/redeem:
    post:
      tags: [Marketplace]
      summary: Redeem a coupon
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '201':
          description: Redemption confirmation (QR payload)
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Redemption' } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /businesses/{id}/reviews:
    post:
      tags: [Marketplace]
      summary: Write a review
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string }
      responses:
        '201': { description: Created }

  /communities/{cid}/leaderboard:
    get:
      tags: [Gamification]
      summary: Community leaderboard
      parameters:
        - { $ref: '#/components/parameters/Cid' }
        - { name: period, in: query, schema: { type: string, enum: [weekly, monthly, all], default: weekly } }
      responses:
        '200': { description: OK }

  /me/points/history:
    get:
      tags: [Gamification]
      summary: My points ledger
      parameters: [ { $ref: '#/components/parameters/Page' } ]
      responses:
        '200': { description: OK }

  /admin/communities/{cid}/members:
    get:
      tags: [Admin]
      summary: List members (filter by status)
      parameters:
        - { $ref: '#/components/parameters/Cid' }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, banned] } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/communities/{cid}/members/{uid}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending member
      parameters:
        - { $ref: '#/components/parameters/Cid' }
        - { name: uid, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/communities/{cid}/invite-codes:
    post:
      tags: [Admin]
      summary: Create an invite code
      parameters: [ { $ref: '#/components/parameters/Cid' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses: { type: integer, nullable: true }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '201': { description: Created }

  /admin/communities/{cid}/moderation/queue:
    get:
      tags: [Admin]
      summary: Moderation review queue
      parameters: [ { $ref: '#/components/parameters/Cid' } ]
      responses:
        '200': { description: OK }

  /admin/communities/{cid}/analytics:
    get:
      tags: [Admin]
      summary: Engagement, retention, growth metrics
      parameters: [ { $ref: '#/components/parameters/Cid' } ]
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Cid:
      name: cid
      in: path
      required: true
      description: Community id
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }

  responses:
    AuthToken:
      description: Authenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
              user: { $ref: '#/components/schemas/User' }
    NoticeList:
      description: Paginated notices
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/Notice' } }
              meta: { $ref: '#/components/schemas/PaginationMeta' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not permitted (role/membership)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (e.g. overbooking, already redeemed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, deleted] }
        profile: { $ref: '#/components/schemas/Profile' }
    Profile:
      type: object
      properties:
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        unit_number: { type: string, nullable: true }
    ProfileInput:
      type: object
      properties:
        display_name: { type: string, minLength: 2, maxLength: 50 }
        avatar_url: { type: string }
        bio: { type: string, maxLength: 500 }
        unit_number: { type: string }
    Community:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        region: { type: string }
        description: { type: string, nullable: true }
    Membership:
      type: object
      properties:
        id: { type: integer }
        community_id: { type: integer }
        role: { type: string, enum: [member, moderator, admin] }
        status: { type: string, enum: [pending, approved, rejected, banned] }
    Notice:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [announcement, event, update, alert, reminder, neighbor_post] }
        title: { type: string }
        body: { type: string }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        location: { type: string, nullable: true }
        is_pinned: { type: boolean }
    NoticeInput:
      type: object
      required: [type, title, body]
      properties:
        type: { type: string, enum: [announcement, event, update, alert, reminder, neighbor_post] }
        title: { type: string }
        body: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        location: { type: string }
    Post:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        media: { type: array, items: { type: string } }
        topic: { type: string, nullable: true }
        like_count: { type: integer }
        comment_count: { type: integer }
        moderation_status: { type: string, enum: [pending, approved, flagged, removed] }
        author: { $ref: '#/components/schemas/Profile' }
    Course:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string }
        is_hsa_eligible: { type: boolean }
        lessons:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              content_type: { type: string, enum: [video, article] }
              duration_seconds: { type: integer, nullable: true }
    Reservation:
      type: object
      properties:
        id: { type: integer }
        amenity_id: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        party_size: { type: integer }
        status: { type: string, enum: [pending, confirmed, cancelled, rejected] }
    Redemption:
      type: object
      properties:
        id: { type: integer }
        deal_id: { type: integer }
        code: { type: string }
        status: { type: string, enum: [saved, redeemed, expired] }
        redeemed_at: { type: string, format: date-time, nullable: true }
